  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  #wrap{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  /* keep the true 192:214 game aspect on every screen — letterbox, never stretch.
     width is the smaller of the viewport width or what the viewport height allows. */
  #stage{ position:relative; aspect-ratio:192/214; max-width:100%; max-height:100%;
    width:min(100%, calc(100vh * 192 / 214));
    width:min(100%, calc(100dvh * 192 / 214));
    background:#000; box-shadow:0 0 0 4px #111, 0 0 40px rgba(0,80,255,.15); }
  canvas{ display:block; width:100%; height:100%; image-rendering:pixelated;
    image-rendering:crisp-edges; background:#000; }

  .screen{ position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:14px;
    background:rgba(0,0,8,.86); z-index:5; padding:18px; }
  .hidden{ display:none !important; }
  .logo b{ display:block; font-size:clamp(26px,7vw,52px); color:#4f7cff; font-weight:bold;
    letter-spacing:2px; text-shadow:2px 2px 0 #0a2; }
  .logo span{ font-size:clamp(11px,2.4vw,15px); color:#7ddb4a; letter-spacing:4px; }
  .sub{ font-size:clamp(11px,2.6vw,15px); color:#cfd6ff; max-width:30em; line-height:1.5; }
  .keys{ font-size:clamp(10px,2.2vw,13px); color:#9aa; line-height:1.7; }
  .keys kbd{ background:#222; border:1px solid #555; border-bottom-width:2px;
    border-radius:4px; padding:1px 6px; color:#fff; }
  button.btn{ font-family:inherit; font-weight:bold; font-size:clamp(14px,3.4vw,18px);
    color:#001; background:#7ddb4a; border:none; border-radius:8px; padding:12px 26px;
    letter-spacing:1px; cursor:pointer; box-shadow:0 4px 0 #3a7d18; }
  button.btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #3a7d18; }
  .bridgesel{ display:flex; align-items:center; gap:10px; font-size:clamp(11px,2.6vw,14px);
    color:#cfd6ff; letter-spacing:1px; }
  .bridgesel .arw{ font-family:inherit; font-weight:bold; font-size:18px; color:#001;
    background:#7ddb4a; border:none; border-radius:6px; width:34px; height:30px; cursor:pointer;

  .bridgesel .arw:active{ transform:translateY(2px); box-shadow:0 1px 0 #3a7d18; }
  .bridgesel #brNum{ min-width:2.2em; text-align:center; font-weight:bold; color:#ffe14d;

  .big{ font-size:clamp(28px,8vw,56px); color:#ff5252; font-weight:bold; letter-spacing:3px;

  .score-line{ font-size:clamp(13px,3vw,18px); color:#ffe14d; }

  #ticker{ position:absolute; left:0; right:0; bottom:0; height:36px; overflow:hidden;
    background:rgba(0,0,0,.62); border-top:1px solid rgba(125,219,74,.5); display:flex; align-items:center; }

<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" width="384" height="428"></canvas>

    <div id="touch" class="hidden">
      <div class="pad" id="padL"><div class="spd"><div class="tbtn" id="btnUp">▲</div><div class="tbtn" id="btnDown">▼</div></div></div>
      <div class="pad" id="padR">
        <div class="firecol">
          <button id="autoChip">AUTO ✗</button>
          <div class="tbtn" id="btnFire">FIRE</div>
        </div>
      </div>
      <div id="dragHint">◀ drag anywhere to steer ▶</div>
    </div>
    <div id="tiltTag" class="tilt-tag hidden">TILT TO STEER</div>
    <button id="btnExit" class="hidden" aria-label="Quit to title">✕</button>

    <div id="titleScreen" class="screen" style="padding-bottom:48px">
      <div class="logo"><span>ACTIVISION STYLE</span><b>RIVER RAID</b></div>
      <div class="sub">Fly up the river. Shoot tankers, choppers, jets and bridges.
        Fly over fuel depots to refuel — run dry and you crash.</div>
      <div class="keys" id="keyHelp">
        <kbd>◀</kbd><kbd>▶</kbd> steer &nbsp; <kbd>▲</kbd> accelerate &nbsp;
        <kbd>▼</kbd> brake &nbsp; <kbd>Space</kbd> fire &nbsp; <kbd>P</kbd> pause
      </div>
      <div class="bridgesel">
        <span>START BRIDGE</span>
        <button class="arw" id="brDown">−</button>
        <span id="brNum">1</span>
        <button class="arw" id="brUp">+</button>
      </div>
      <button class="btn" id="startBtn">START GAME</button>
      <div class="keys" id="tiltHint"></div>
      <div id="ticker"><div class="track" id="tickerTrack"></div></div>
    </div>

    <div id="pauseScreen" class="screen hidden">
      <div class="logo"><b style="font-size:clamp(22px,6vw,40px)">PAUSED</b></div>
      <button class="btn" id="resumeBtn">RESUME</button>
    </div>

    <div id="overScreen" class="screen hidden">
      <div class="big">GAME OVER</div>
      <div class="score-line" id="finalScore">SCORE 0</div>
      <div class="score-line" id="bestScore">BEST 0</div>
      <button class="btn" id="continueBtn">CONTINUE</button>
      <button class="btn" id="againBtn">PLAY AGAIN</button>
    </div>
  </div>
</div>

/* ---- terrain generator ported from the pygame-River-Raid project (MIT,
   andy-omelyanenko): a meandering river width + slow x-offset drift + islands
   with gaps + a narrow bridge neck at each section. Pre-generated deterministically. */
const T_TOTAL=70000;
const tL=new Int16Array(T_TOTAL), tR=new Int16Array(T_TOTAL);
const tIL=new Int16Array(T_TOTAL), tIR=new Int16Array(T_TOTAL);
(function genTerrain(){
  let seed=0x6a3f17c5>>>0;
  const RB=()=>{ seed=(Math.imul(seed,1664525)+1013904223)>>>0; return (seed>>>15)&0xFF; };  // 0..255
  const RI=(a,b)=>a+Math.floor(RB()/256*(b-a+1));
  const MID=FIELD_W>>1, BRW=24, SETTLE=64, MAXX=12;
  const BRL=SECTION_BLOCKS*BLOCK_H;            // bridge spacing (one per section)
  let width=80, xoff=0, dir=0, Nx=0, Nw=0, target=80;
  let Nisl=0, islMax=0, islBot=0, islTop=0, islH=0, gap=0;
  for(let L=0;L<T_TOTAL;L++){
    const inSec=L%BRL, area=Math.floor(L/BRL);
    if(gap>0) gap--;
    const islandsGap = area<3?2*PLAY_H : area<6?PLAY_H : (PLAY_H>>1);
    // spawn an island mid-section, in wide enough water, with a gap since the last one
    if(inSec>SETTLE && (BRL-inSec)>PLAY_H && Nw===0 && Nisl===0 && width>=96 && gap===0 && RB()%9===1 && area>0){
      islH=RI(40, Math.min(PLAY_H, 70+area*5)); Nisl=islH;
      islMax=RI(16,46); islBot=RI(10,islMax); islTop=RI(10,islMax);
    }
    // slow x-offset drift (the river meanders left/right), hard-bounded
    if(Nx<=0){ dir=RB()%3-1; Nx=RB()%8+4; }
    xoff+=dir*(RB()%2+1); Nx--;
    if(xoff>MAXX){ xoff=MAXX; dir=-1; } else if(xoff<-MAXX){ xoff=-MAXX; dir=1; }
    if(Nisl===0){
      if(inSec<4){ width=BRW; target=RI(64,112); Nw=SETTLE; }        // bridge neck, then opens up
      else if(RB()%150===1 && Nw===0){ target=RI(46,112); Nw=SETTLE; }  // occasional width change
      if((BRL-inSec)<=SETTLE){ target=BRW; Nw=SETTLE; }              // narrow into the next bridge
    } else {
      const iw = Nisl===islH?islBot : (Nisl===1?islTop : RI((islTop+islBot)>>1, islMax));
      tIL[L]=MID-(iw>>1)+xoff; tIR[L]=MID+(iw>>1)+xoff;
      Nisl--; if(Nisl===0) gap=islandsGap;
    }
    if(Nw>0){ width += Math.trunc((target-width)/Nw); Nw--; }
    let l=MID-(width>>1)+xoff, r=MID+(width>>1)+xoff;
    l=Math.max(2,Math.min(FIELD_W-8,l)); r=Math.max(l+6,Math.min(FIELD_W-2,r));
    tL[L]=l; tR[L]=r;
  }
  // smooth the banks into gentle curves (removes per-line jaggedness)
  const sm=(arr)=>{ const out=new Int16Array(T_TOTAL), R=4;
    for(let L=0;L<T_TOTAL;L++){ let s=0,n=0; for(let k=-R;k<=R;k++){ const i=L+k; if(i>=0&&i<T_TOTAL){ s+=arr[i]; n++; } } out[L]=Math.round(s/n); }
    arr.set(out); };
  sm(tL); sm(tR);
  // smooth island edges within each island run (skip the empty gaps)
  const smI=(arr)=>{ const out=new Int16Array(T_TOTAL), R=3;
    for(let L=0;L<T_TOTAL;L++){ if(arr[L]<=0){ out[L]=arr[L]; continue; } let s=0,n=0; for(let k=-R;k<=R;k++){ const i=L+k; if(i>=0&&i<T_TOTAL&&arr[i]>0){ s+=arr[i]; n++; } } out[L]=Math.round(s/n); }
    arr.set(out); };
  smI(tIL); smI(tIR);
  // taper each island run to a POINT at both ends so it never looks sliced flat across
  for(let i=0;i<T_TOTAL;){
    if(tIL[i]>0){
      let j=i; while(j<T_TOTAL && tIL[j]>0) j++;          // island run = [i, j)
      const run=j-i, tap=Math.min(14, Math.max(1, run>>1));
      for(let k=0;k<tap;k++){
        const f=(k+1)/(tap+1);                            // 0 at the tip -> 1 inside
        let a=i+k, cA=(tIL[a]+tIR[a])/2, hA=(tIR[a]-tIL[a])/2*f;
        tIL[a]=Math.round(cA-hA); tIR[a]=Math.round(cA+hA);
        let b=j-1-k, cB=(tIL[b]+tIR[b])/2, hB=(tIR[b]-tIL[b])/2*f;
        tIL[b]=Math.round(cB-hB); tIR[b]=Math.round(cB+hB);
      }
      i=j;
    } else i++;
  }
})();

/* ----------------------------------------------------------- 16-bit LFSR */
let R_lo=0x14, R_hi=0xA8;
function lfsrSeed(){ R_lo=0x14; R_hi=0xA8; }
function lfsrNext(){
  let a=R_hi;
  a=(a<<1)&0xFF; a=(a<<1)&0xFF; a=(a<<1)&0xFF;   // hi<<3
  a^=R_hi;                                       // EOR hi
  const carry=(a>>7)&1;                          // ASL A -> C
  const nlo=((R_lo<<1)|carry)&0xFF;
  const clo=(R_lo>>7)&1;
  const nhi=((R_hi<<1)|clo)&0xFF;
  R_lo=nlo; R_hi=nhi;
}

/* --------------------------------------------------------- generator
   Live port of Carol Shaw's section generator (the 800XL/2600 share it). The
   16-bit LFSR (seed $A814) drives BOTH river width and objects in lockstep, so
   the layout is the authentic deterministic sequence — and endless, like the
   real cartridge (no looping map). Block 0 of each section carries the bridge. */
const ISL_FLAG=0x80, CHG_FLAG=0x40;
let gen={};
function resetGenerator(){ lfsrSeed(); gen={ blk:0, level:1, pf:0, prevId:8, sec:0 }; }
// PF pattern id (2..14, higher = thicker bank) -> river half-width in field px
function halfForId(id){ return Math.round(64 - (id-2)*(44/12)); }   // 64 (wide) .. ~20 (narrow)

function nextBlockDesc(){
  const isBridge=(gen.blk===0);
  // RNG snapshot at each section start, so respawn/bridge-select can replay it exactly
  const snap = isBridge ? {lo:R_lo,hi:R_hi,blk:0,level:gen.level,pf:gen.pf,prevId:gen.prevId,sec:gen.sec} : null;
  lfsrNext();
  const lvl=Math.min(48,gen.level);
  const straight=(lvl&1)===1;

  let id=8, island=false;
  if(isBridge){ id=14; gen.pf=0; }                 // narrow bridge neck
  else if(straight){ id=7; gen.pf=0; }             // straight (no-island) sections
  else {
    // island flag state machine (00->01/00, 01->11, 10->00, 11->10/11)
    let s=gen.pf; const isl=(s&ISL_FLAG)!==0, chg=(s&CHG_FLAG)!==0;
    if(isl!==chg) s = chg ? (ISL_FLAG|CHG_FLAG) : 0;
    else if((R_lo&0x30)===0) s = isl ? (s&~CHG_FLAG) : (s|CHG_FLAG);
    gen.pf=s; island=(s&ISL_FLAG)!==0;
    let r=R_lo&0x0F; if(r<2) r+=2;                  // 2..15
    const maxId = lvl<5 ? 8 : (island?13:14);       // early levels limit the valley width
    id=Math.min(r,maxId);
  }
  gen.prevId=id;
  const half = isBridge ? 22 : halfForId(id);
  const islandHalf = (island && gen.blk>2) ? Math.max(8,Math.round(half*0.5)) : 0;

  // --- object selection: spawn model adapted from the pygame-River-Raid project (MIT,
  //     andy-omelyanenko) — heli-dominant mix, fuel on rolls 3-4, balloons on a 0 / narrow river ---
  let obj=OBJ.NONE, dir=(R_lo&0x80)?1:-1;
  if(isBridge){ obj=OBJ.BRIDGE; }
  else if(gen.blk===1){ obj=OBJ.NONE; }              // open run right after the bridge
  else {
    const maxRnd = lvl<10 ? 7 : 15;
    const rnd = R_hi % (maxRnd+1);
    if(rnd===3||rnd===4) obj=OBJ.FUEL;               // fuel
    else if(rnd>=12) obj=OBJ.NONE;                    // open water (only when maxRnd=15)
    else if(rnd===0) obj=OBJ.BALLOON;
    else if(rnd===1) obj=OBJ.SHIP;
    else obj=OBJ.HELI;                                // rnd 2,5,6,7,8,9,10,11 -> helicopter
  }

  const b={ sec:gen.sec, blk:gen.blk, isBridge, half, islandHalf, obj, dir, rx:(R_lo&0x3F), onBank:(R_hi&1)?1:-1, snap };
  if(obj!==OBJ.NONE && obj!==OBJ.BRIDGE){
    const inner=Math.max(6,half-8);
    let x=CENTER-inner+(b.rx/63)*(inner*2);
    if(islandHalf>2 && Math.abs(x-CENTER)<islandHalf+6) x+=(x<CENTER?-1:1)*(islandHalf+8);
    b.objX=Math.max(8,Math.min(FIELD_W-8,x));
  }

  gen.blk++;
  if(gen.blk>=SECTION_BLOCKS){ gen.blk=0; gen.level=Math.min(48,gen.level+1); gen.sec++; }
  return b;
}
// fast-forward the generator to the start of section n (deterministic, like the real game)
function advanceToSection(n){ let guard=0; while(gen.sec<n && guard++<n*20+50) nextBlockDesc(); }
function restoreSnap(s){ R_lo=s.lo; R_hi=s.hi; gen.blk=s.blk; gen.level=s.level; gen.pf=s.pf; gen.prevId=s.prevId; gen.sec=s.sec; }

/* ----------------------------------------------------------------- audio */
const A2=(()=>{
  // POKEY-style synthesis: the engine is a buzzy detuned motor, effects are
  // built from the TIA/POKEY-flavoured noise + square channels.
  let ctx=null,master=null,started=false;
  let e1,e2,eNoiseSrc,eNoiseGain,eF,eGain,wob,wobGain;
  function init(){ if(ctx)return; const AC=window.AudioContext||window.webkitAudioContext; ctx=new AC();
    master=ctx.createGain(); master.gain.value=0.45; master.connect(ctx.destination); }
  function resume(){ if(ctx&&ctx.state==='suspended') ctx.resume(); }
  function noise(d){ const n=Math.floor(ctx.sampleRate*d), b=ctx.createBuffer(1,n,ctx.sampleRate), x=b.getChannelData(0);
    for(let i=0;i<n;i++)x[i]=Math.random()*2-1; return b; }
  function loopNoise(){ const b=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate), x=b.getChannelData(0);
    for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1; return b; }
  function startEngine(){ if(!ctx||started)return;
    // Atari "plane taking off" roar: rushing filtered noise + a rising turbine whine.
    // The roar brightens and swells smoothly as you accelerate.
    eNoiseSrc=ctx.createBufferSource(); eNoiseSrc.buffer=loopNoise(); eNoiseSrc.loop=true;
    eF=ctx.createBiquadFilter(); eF.type='bandpass'; eF.frequency.value=520; eF.Q.value=0.9;
    eNoiseGain=ctx.createGain(); eNoiseGain.gain.value=1.0;                  // air-roar mix
    e1=ctx.createOscillator(); e1.type='sawtooth'; e1.frequency.value=120;   // turbine whine
    wobGain=ctx.createGain(); wobGain.gain.value=0.10;                       // whine mix (subtle)
    eGain=ctx.createGain(); eGain.gain.value=0;                              // master swell (silent at idle)
    eNoiseSrc.connect(eF); eF.connect(eNoiseGain); eNoiseGain.connect(eGain);
    e1.connect(wobGain); wobGain.connect(eGain);
    eGain.connect(master);
    eNoiseSrc.start(); e1.start(); started=true; }
  function stopEngine(){ if(!started)return; try{eNoiseSrc.stop();e1.stop();}catch(e){} started=false; }
  function setThrust(on,s){ if(!started)return; const t=ctx.currentTime;
    if(!on){ eGain.gain.setTargetAtTime(0,t,0.20); return; }                 // spool down when coasting
    // taking off: roar gets brighter + turbine whine rises + volume swells with throttle
    eF.frequency.setTargetAtTime(480+s*2200,t,0.15);
    e1.frequency.setTargetAtTime(110+s*260,t,0.15);
    eGain.gain.setTargetAtTime(0.045+s*0.05,t,0.12); }
  function fire(){ if(!ctx)return; const t=ctx.currentTime;
    const o=ctx.createOscillator(),g=ctx.createGain(); o.type='square';
    o.frequency.setValueAtTime(1200,t); o.frequency.exponentialRampToValueAtTime(120,t+0.16);
    g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(0.2,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.19); }
  function heliShoot(){ if(!ctx)return; const t=ctx.currentTime;
    const o=ctx.createOscillator(),g=ctx.createGain(); o.type='square';
    o.frequency.setValueAtTime(260,t); o.frequency.exponentialRampToValueAtTime(90,t+0.14);
    g.gain.setValueAtTime(0.1,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.16); }
  function explosion(big){ if(!ctx)return; const t=ctx.currentTime, d=big?0.85:0.5;
    const s=ctx.createBufferSource(); s.buffer=noise(d);
    const f=ctx.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(big?2200:1500,t); f.frequency.exponentialRampToValueAtTime(90,t+d);
    const g=ctx.createGain(); g.gain.setValueAtTime(big?0.5:0.36,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
    // low boom under the noise
    const o=ctx.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(big?150:200,t);
    o.frequency.exponentialRampToValueAtTime(40,t+d); const og=ctx.createGain();
    og.gain.setValueAtTime(big?0.3:0.2,t); og.gain.exponentialRampToValueAtTime(0.001,t+d);
    s.connect(f); f.connect(g); g.connect(master); o.connect(og); og.connect(master);
    s.start(t); s.stop(t+d); o.start(t); o.stop(t+d); }
  // Original River Raid refuel: a steady rhythmic BEEP while flying over a depot —
  // a lower beep while filling, a higher beep once the tank is full. The game loop
  // calls this on a fixed cadence (not every frame), so it's a clean "beep…beep…beep".
  function refuelBeep(full){ if(!ctx)return; const t=ctx.currentTime;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='square'; o.frequency.value = full ? 784 : 466;     // high beep = full, low beep = filling
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.06,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.075);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.085); }
  function lowFuel(){ if(!ctx)return; const t=ctx.currentTime; const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='square'; o.frequency.value=300; g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(0.14,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.22); o.connect(g); g.connect(master); o.start(t); o.stop(t+0.24); }
  return {init,resume,startEngine,stopEngine,setThrust,heliShoot,fire,explosion,refuelBeep,lowFuel};
})();

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

let game=null, blockCount=0, lastStageSec=0;   // lastStageSec = furthest stage reached
function newGame(startSec){
  startSec=startSec||0;
  resetGenerator(); advanceToSection(startSec);   // generator now at the start of that section
  blockCount = startSec>0 ? 999 : 0;              // skip the gentle intro when continuing
  const worldStart=startSec*SECTION_BLOCKS*BLOCK_H;  // align terrain to this section/bridge
  const initSnap={lo:R_lo,hi:R_hi,blk:gen.blk,level:gen.level,pf:gen.pf,prevId:gen.prevId,sec:gen.sec};
  game={ state:'play', score:0, lives:4, fuel:1.0, nextLife:10000, level:startSec+1,
    dist:worldStart, speed:1.0, baseV:Math.min(78,36+startSec*1.5),
    blocks:[], worldTop:worldStart,
    jetX:CENTER, jetDir:0,
    bullets:[], explosions:[], objs:[],
    fireCool:0, invuln:1.5, deadTimer:0, lowBeep:0, t:0,
    shownLevel:startSec+1, banner:startSec>0?1.6:0, checkpoints:[{wy:worldStart,snap:initSnap,sec:startSec}],
    waiting:false, heliTimer:1.2, ebullets:[] };
  while(game.worldTop < game.dist+JET_Y+BLOCK_H*4) pushBlock();
  game.jetX=safeSpawnX(game.dist);                // start inside the (winding) channel
}
function pushBlock(){
  const b=nextBlockDesc();
  b.worldY=game.worldTop;             // bottom edge of block in world coords
  b.parity=(Math.floor(b.worldY/BLOCK_H))&1;  // stable bank-stripe parity
  if(blockCount<4){ b.obj=OBJ.NONE; b.isBridge=false; } // ease-in
  game.worldTop+=BLOCK_H; blockCount++;
  game.blocks.push(b);
  if(b.isBridge && b.snap){ game.checkpoints.push({wy:b.worldY, snap:b.snap, sec:b.sec});
    if(game.checkpoints.length>6) game.checkpoints.shift(); }
  const cy=b.worldY+BLOCK_H/2;
  const bridgeWy=b.worldY+4;
  if(b.obj===OBJ.BRIDGE) game.objs.push({type:OBJ.BRIDGE,wy:bridgeWy,sec:b.sec,alive:true});
  else if(b.obj!==OBJ.NONE){
    const dim=b.obj===OBJ.FUEL?G.fuel:b.obj===OBJ.SHIP?G.ship:b.obj===OBJ.HELI?G.heli0:b.obj===OBJ.JET?G.plane:ACT.balloon;
    // place within the actual river channel (pick a side if an island splits it)
    const e=riverEdges(cy), m=dim.w/2+1, frac=b.rx/63; let lo=e.left+m, hi=e.right-m;
    if(e.islL>2){ const lw=e.islL-e.left, rw=e.right-e.islR;
      if(lw>=rw){ lo=e.left+m; hi=e.islL-m; } else { lo=e.islR+m; hi=e.right-m; } }
    const x=Math.max(8,Math.min(FIELD_W-8, lo+frac*Math.max(0,hi-lo)));
    game.objs.push({type:b.obj,x,wy:cy,w:dim.w,h:dim.h,dir:b.dir,alive:true,
      vx:b.obj===OBJ.SHIP?0.18:b.obj===OBJ.HELI?0.35:b.obj===OBJ.JET?0.6:0});
  }
  // fast enemy jets streak across the river from stage 5+ (pygame-River-Raid behaviour)
  if(blockCount>=4 && !b.isBridge && gen.level>=5 && (b.rx%9)===1){
    const e=riverEdges(cy), d=G.plane;
    game.objs.push({type:OBJ.JET,x:Math.max(8,Math.min(FIELD_W-8,e.cx)),wy:cy+SAMPLE_H,

  }

  if(blockCount>=4 && b.isBridge && (b.rx&3)===0){
    game.objs.push({type:OBJ.TANK,wy:bridgeWy,x:riverEdges(bridgeWy).cx,onBridge:true,w:ACT.tank.w,h:ACT.tank.h,alive:true});
  }

  if(blockCount>=4 && !b.isBridge && (b.rx&1)===0){
    game.objs.push({type:OBJ.MOUNTAIN,wy:b.worldY+(b.rx%BLOCK_H),onBank:(b.rx&2)?1:-1,size:6+(b.rx&3)*3,alive:true});

}
// world<->screen : feature ahead (larger wy) is higher up; flows DOWN toward jet
function w2s(wy){ return JET_Y - (wy - game.dist); }
function s2w(sy){ return game.dist + (JET_Y - sy); }

function blockAt(wy){
  const b0=game.blocks[0];
  let i=Math.floor((wy-b0.worldY)/BLOCK_H);
  i=Math.max(0,Math.min(game.blocks.length-1,i));
  return i;
}
const SAMPLE_H=BLOCK_H/2;
const T_LOOP=Math.floor(T_TOTAL/(SECTION_BLOCKS*BLOCK_H))*(SECTION_BLOCKS*BLOCK_H);  // section-aligned loop
function riverEdges(wy){
  // sample the generated per-line bank profile (1 line = 1 world px); loops on section boundaries
  let f=wy; let i=Math.floor(f), t=f-i;
  i=((i%T_LOOP)+T_LOOP)%T_LOOP; const j=(i+1)%T_LOOP;
  const left =tL[i]+(tL[j]-tL[i])*t, right=tR[i]+(tR[j]-tR[i])*t;
  let islL=0, islR=0;
  const aL=tIL[i],aR=tIR[i],bL=tIL[j],bR=tIR[j];
  if(aL>0 && bL>0){ islL=aL+(bL-aL)*t; islR=aR+(bR-aR)*t; }
  else if(aL>0){ islL=aL; islR=aR; }
  else if(bL>0){ islL=bL; islR=bR; }
  if(islR-islL<2){ islL=0; islR=0; }
  return {left, right, islL, islR, half:(right-left)/2, cx:(left+right)/2,
          island:(islL>0 && islL<CENTER && islR>CENTER)?(islR-islL)/2:0};
}
// pick an x in open water at worldY wy (side channel if the centre is an island)
function safeSpawnX(wy){
  const e=riverEdges(wy);
  if(e.islL>2){                                  // island splits the river -> pick the wider channel
    const lw=e.islL-e.left, rw=e.right-e.islR;
    return lw>=rw ? (e.left+e.islL)/2 : (e.islR+e.right)/2;
  }
  return (e.left+e.right)/2;
}

/* -------------------------------------------------------------- input */
const keys={}; let tiltSteer=0, tiltThrottle=0, tiltOn=false, autoFire=false;
addEventListener('keydown',e=>{ if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
  keys[e.key]=true; if(e.key==='p'||e.key==='P')togglePause(); });
addEventListener('keyup',e=>{ keys[e.key]=false; });
function hold(id,k){ const el=document.getElementById(id); if(!el)return;
  const on=e=>{e.preventDefault();keys[k]=true;}, off=e=>{e.preventDefault();keys[k]=false;};
  el.addEventListener('touchstart',on,{passive:false}); el.addEventListener('touchend',off,{passive:false});

hold('btnUp','ArrowUp'); hold('btnDown','ArrowDown'); hold('btnFire',' ');

// PADDLE steering: drag a finger anywhere on the playfield to slide the jet (relative, variable speed)
let dragId=null, dragLastX=0, dragAccum=0, dragHintShown=false;
const cvEl=document.getElementById('cv'), dragHintEl=document.getElementById('dragHint');
function fieldScale(){ const r=cvEl.getBoundingClientRect(); return r.width? (192/r.width) : 0.5; }  // FIELD_W=192
cvEl.addEventListener('touchstart',e=>{ if(dragId===null){ const t=e.changedTouches[0]; dragId=t.identifier; dragLastX=t.clientX;
  if(dragHintEl){ dragHintEl.style.opacity='0'; dragHintShown=true; } } },{passive:true});
cvEl.addEventListener('touchmove',e=>{ for(const t of e.changedTouches){ if(t.identifier===dragId){

// AUTO-FIRE toggle — tap FIRE to shoot each press, or switch AUTO on for continuous fire
const autoChip=document.getElementById('autoChip');
function setAuto(on){ autoFire=on; autoChip.classList.toggle('on',on); autoChip.textContent='AUTO '+(on?'✓':'✗');
  document.getElementById('btnFire').classList.toggle('auto',on); }

// a FIRE tap shoots instantly (don't wait out a previous shot's cooldown)
document.getElementById('btnFire').addEventListener('touchstart',()=>{ if(game&&game.fireCool>0.05)game.fireCool=0; },{passive:true});
let tiltNeutral=null, betaNeutral=null, tiltBound=false;
function enableTilt(){
  if(tiltBound) return; tiltBound=true;
  addEventListener('deviceorientation',e=>{
    if(e.gamma==null)return;
    let g=e.gamma, b=e.beta;                              // gamma = left/right, beta = front/back
    if(window.orientation===90){ g=-e.beta; b=e.gamma; }
    else if(window.orientation===-90){ g=e.beta; b=-e.gamma; }
    if(tiltNeutral===null) tiltNeutral=g;                 // first reading = your comfortable hold
    if(betaNeutral===null) betaNeutral=b;
    // STEER (gamma): proportional — gentle tilt = slow precise turn, hard tilt = fast turn
    let d=g-tiltNeutral; const dead=2, span=15;
    let s = Math.abs(d)<dead?0:Math.max(-1,Math.min(1,(d-Math.sign(d)*dead)/span));
    s = s*Math.abs(s);                                    // squared response: fine near centre, quick at the edges
    tiltSteer += (s-tiltSteer)*0.4;
    // THROTTLE (beta): tilt the top of the phone forward to speed up, back to slow down
    let db=betaNeutral-b; const bdead=5, bspan=22;
    let th = Math.abs(db)<bdead?0:Math.max(-1,Math.min(1,(db-Math.sign(db)*bdead)/bspan));
    tiltThrottle += (th-tiltThrottle)*0.25;               // smoother so speed doesn't jitter
    tiltOn=true;

}
function recalibrateTilt(){ tiltNeutral=null; betaNeutral=null; }   // re-centre to current hold

/* -------------------------------------------------------------- loop */
let last=0;
function loop(ts){ requestAnimationFrame(loop); if(!game)return;
  let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05;
  if(game.state==='play'&&!paused) update(dt);
  else if(game.state==='dead') updateDead(dt);
  render(); }
requestAnimationFrame(ts=>{ last=ts; requestAnimationFrame(loop); });

function update(dt){
  const g=game; g.t+=dt;
  // after a death you sit at the bridge until you FIRE — then the plane starts moving
  if(g.waiting){
    A2.setThrust(false,0);
    if(keys[' ']||autoFire||keys['ArrowUp']||(tiltOn&&tiltThrottle>0.2)) g.waiting=false;
    else return;          // frozen: no scroll, no fuel burn, no collisions
  }
  // throttle — buttons, or tilt the phone forward/back for variable speed
  let target=1.0;
  if(keys['ArrowUp'])target=2.0;
  else if(keys['ArrowDown'])target=0.6;
  else if(tiltOn && Math.abs(tiltThrottle)>0.05) target=Math.max(0.55, Math.min(2.0, 1.3 + tiltThrottle*0.7));
  g.speed+=(target-g.speed)*Math.min(1,dt*4);
  const accelOn = keys['ArrowUp'] || (tiltOn && tiltThrottle>0.12);
  A2.setThrust(accelOn, (g.speed-0.6)/1.4);            // engine roar only while speeding up
  // fly forward
  const v=g.baseV*g.speed; g.dist+=v*dt;
  g.level=gen.level;
  if(g.banner>0) g.banner-=dt;
  // each bridge you clear and fly past = a new level
  for(const o of g.objs){
    if(o.type===OBJ.BRIDGE && !o.counted && g.dist>o.wy){
      o.counted=true;
      if(!o.alive){ g.shownLevel++; g.banner=2.0; g.baseV=Math.min(78,g.baseV+2); lastStageSec=Math.max(lastStageSec,(o.sec||0)); }  // destroyed -> advance
    }
  }

  // generate ahead / prune behind
  while(g.worldTop < g.dist+JET_Y+BLOCK_H*3) pushBlock();
  while(g.blocks.length>4 && g.blocks[0].worldY < g.dist+JET_Y-PLAY_H-BLOCK_H*2) g.blocks.shift();
  // only prune objects that have passed BELOW the bottom of the screen
  // (objects ahead must persist so they scroll into view)
  g.objs=g.objs.filter(o=> o.wy > g.dist+JET_Y-PLAY_H-24);

  // steer — keys / tilt give a velocity; the touch paddle moves the jet directly (1:1 drag)
  let mv=0; if(keys['ArrowLeft'])mv-=1; if(keys['ArrowRight'])mv+=1;
  if(tiltOn&&Math.abs(tiltSteer)>0.01)mv+=tiltSteer;
  g.jetX+=mv*72*dt;
  if(dragAccum){ g.jetX+=dragAccum; if(Math.abs(dragAccum)>0.15)g.jetDir=dragAccum>0?1:-1; dragAccum=0; }
  else g.jetDir=mv>0.1?1:mv<-0.1?-1:0;

  const edge=riverEdges(g.dist), jw=4;

    if(edge.islL>0 && g.jetX+jw>edge.islL && g.jetX-jw<edge.islR) crash=true;  // hit the island
    if(crash){ killJet(); return; }
  }
  g.jetX=Math.max(jw,Math.min(FIELD_W-jw,g.jetX));
  if(g.invuln>0)g.invuln-=dt;

  // fuel
  g.fuel-=dt*0.018*(0.6+g.speed*0.4);
  if(g.fuel<=0){ g.fuel=0; killJet(); return; }

  // fire (bullets travel up toward larger worldY) — tap FIRE, hold, or enable AUTO-FIRE
  g.fireCool-=dt;
  if((keys[' ']||autoFire)&&g.fireCool<=0&&g.bullets.length<2){
    g.bullets.push({x:g.jetX,sy:JET_Y-6}); g.fireCool=0.28; A2.fire();

  g.bullets=g.bullets.filter(b=>b.sy>-6);

  // 800XL: enemies shoot back. Missiles travel HORIZONTALLY across the river
  // (and ride the scroll downward) — helicopters & land tanks only.
  g.heliTimer-=dt;
  if(g.heliTimer<=0 && g.shownLevel>=4){              // helicopters don't shoot until stage 4
    const shooters=g.objs.filter(o=>{ if(!o.alive||o.type!==OBJ.HELI)return false;
      const sy=w2s(o.wy); return sy>4 && sy<JET_Y-10; });
    if(shooters.length){
      const o=shooters[(Math.random()*shooters.length)|0];
      const dir=(g.jetX>=o.x)?1:-1;                    // fire toward the jet's side
      g.ebullets.push({x:o.x, wy:o.wy, vx:dir*(48+g.shownLevel*5)});  // faster missiles deeper in
      A2.heliShoot();
    }
  }
  if(g.heliTimer<=0){ g.heliTimer=Math.max(0.4, 1.7+Math.random()*1.2 - g.shownLevel*0.045); }  // and fire more often deeper in
  // move enemy missiles horizontally; they descend with the scroll (fixed worldY)
  for(const eb of g.ebullets) eb.x += eb.vx*dt;
  g.ebullets=g.ebullets.filter(eb=>{ const sy=w2s(eb.wy); return eb.x>-6&&eb.x<FIELD_W+6&&sy>-6&&sy<PLAY_H+6; });
  if(g.invuln<=0){
    for(const eb of g.ebullets){ const sy=w2s(eb.wy);
      if(Math.abs(eb.x-g.jetX)<4 && Math.abs(sy-JET_Y)<5){ boom(g.jetX,JET_Y,false); killJet(); return; }
    }
  }
  // enemy horizontal patrol
  for(const o of g.objs){
    if(!o.alive)continue;
    if(o.type===OBJ.SHIP||o.type===OBJ.HELI||o.type===OBJ.JET){
      o.x+=o.dir*o.vx*v*dt*0.7;
      const e=riverEdges(o.wy), m=o.w/2+1, mid=(e.islL+e.islR)/2;

      if(o.x+m>e.right){o.x=e.right-m;o.dir=-1;}

      }

    } else if(o.type===OBJ.FUEL||o.type===OBJ.BALLOON){
      // keep static water objects off the land and off any island
      const e=riverEdges(o.wy), m=o.w/2+1, mid=(e.islL+e.islR)/2;
      if(e.islL>1 && o.x+m>e.islL && o.x-m<e.islR)
        o.x = o.x<mid ? (e.left+e.islL)/2 : (e.islR+e.right)/2;
      o.x=Math.max(e.left+m, Math.min(e.right-m, o.x));
    }
  }

  // bullet vs object
  for(const b of g.bullets){
    for(const o of g.objs){
      if(!o.alive||o.type===OBJ.HOUSE||o.type===OBJ.MOUNTAIN||(o.type===OBJ.BRIDGE&&o.passable))continue;
      const sy=w2s(o.wy); let ox,ow,oh;
      if(o.type===OBJ.BRIDGE){const e=riverEdges(o.wy);ox=e.cx;ow=e.right-e.left;oh=8;} else {ox=o.x;ow=o.w+8;oh=o.h+4;}
      if(Math.abs(b.x-ox)<ow/2 && b.sy>sy-oh-3 && b.sy<sy+5){
        o.alive=false; b.sy=-99; addScore(SCORE[o.type]||0);
        boom(ox,sy,o.type===OBJ.BRIDGE); A2.explosion(o.type===OBJ.BRIDGE);
        buzz(o.type===OBJ.BRIDGE?[0,30,30,60]:18);   // bridge = strong double buzz, enemy = light tap
        if(o.type===OBJ.BRIDGE){           // bonus if a tank is crossing the bridge (750 total)
          for(const t of g.objs){ if(t.alive&&t.type===OBJ.TANK&&t.onBridge&&Math.abs(t.wy-o.wy)<BLOCK_H){
            t.alive=false; addScore(250); boom(t.x,sy,false); } }
        }
        break;
      }
    }
  }
  g.bullets=g.bullets.filter(b=>b.sy>-6);

  // jet vs object / refuel  (tight hitboxes; tanks are shoot-for-bonus, not lethal)
  let refuelHit=false;
  if(g.invuln<=0){
    const jhw=3, jhh=4;                       // jet half-size
    for(const o of g.objs){
      if(!o.alive||o.type===OBJ.HOUSE||o.type===OBJ.MOUNTAIN||o.type===OBJ.TANK||(o.type===OBJ.BRIDGE&&o.passable))continue;
      const sy=w2s(o.wy);
      // sprites are drawn bottom-anchored at sy (span [sy-h, sy]); bridge is centred on sy
      const ocy=o.type===OBJ.BRIDGE?sy:(sy-o.h/2);
      const ohh=o.type===OBJ.BRIDGE?6:(o.h/2);
      if(Math.abs(ocy-JET_Y) > jhh+ohh) continue;
      const eb=o.type===OBJ.BRIDGE?riverEdges(o.wy):null;
      const ox=eb?eb.cx:o.x, ohw=eb?(eb.right-eb.left)/2:(o.w/2);
      if(Math.abs(g.jetX-ox) < jhw+ohw){
        if(o.type===OBJ.FUEL){ g.fuel=Math.min(1,g.fuel+0.012); refuelHit=true; if(g.t>(g.refuelBuzzT||0)){buzz(10);g.refuelBuzzT=g.t+0.5;} }
        else { boom(g.jetX,JET_Y,false); killJet(); return; }
      }
    }
  }
  // rhythmic refuel beep on a fixed cadence (≈6/sec): low while filling, high once full
  if(refuelHit){ g.refuelBeepT=(g.refuelBeepT||0)-dt;
    if(g.refuelBeepT<=0){ A2.refuelBeep(g.fuel>=0.999); g.refuelBeepT=0.16; } }
  else g.refuelBeepT=0;
  for(const ex of g.explosions) ex.t+=dt;
  g.explosions=g.explosions.filter(ex=>ex.t<ex.life);
}
function updateDead(dt){ for(const ex of game.explosions)ex.t+=dt; game.deadTimer-=dt;
  if(game.deadTimer<=0){ if(game.lives<=0)endGame(); else respawn(); } }

function addScore(p){ game.score+=p; if(game.score>=game.nextLife){game.lives++;game.nextLife+=10000;} }
// haptic feedback — Android Chrome/Firefox honour navigator.vibrate; iOS Safari ignores it (Apple blocks it)
let haptics=true; function buzz(p){ if(haptics&&navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }
let shake=0;                                 // screen-shake amount (seconds), decays in render
function boom(x,y,big){ game.explosions.push({x,y,t:0,life:big?0.6:0.42,big}); shake=Math.max(shake, big?0.55:0.3); }
function killJet(){ if(game.state!=='play')return; A2.explosion(false); boom(game.jetX,JET_Y,false);
  shake=Math.max(shake,0.6); buzz([0,45,40,90]);          // crash = biggest shake + double buzz

function respawn(){
  game.state='play';
  // restart just past the LAST bridge you cleared (checkpoint), not mid-river
  let cp=null;
  for(const c of game.checkpoints) if(c.wy<=game.dist+1) cp=c;
  if(cp && cp.snap){
    restoreSnap(cp.snap);                        // replay the exact section from its bridge
    game.worldTop=cp.wy; game.dist=cp.wy+9;      // jet sits on the bridge
    game.blocks=[]; game.objs=[]; game.explosions=[];
    game.checkpoints=[{wy:cp.wy,snap:cp.snap,sec:cp.sec}];
    blockCount=999;                             // no ease-in on restart
    while(game.worldTop < game.dist+JET_Y+BLOCK_H*4) pushBlock();
    // make the bridge you start on already open (passable, doesn't re-award a level)

  }

}

let best=0;

/* -------------------------------------------------------------- render */
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w,h); }
// smooth, organic coastline offset (coherent waves, not random pixel noise)
function shoreJit(wy,side){
  return 2.4*Math.sin(wy*0.085+side*2.3) + 1.1*Math.sin(wy*0.215+side*5.1) + 0.6*Math.sin(wy*0.5+side);
}
function sprite(parsed,cx,topY,color,mirror){
  const w=parsed.w; ctx.fillStyle=color;
  const ox=Math.round(cx-w/2), oy=Math.round(topY);
  for(const p of parsed.pts){ const c=mirror?(w-1-p[0]):p[0]; ctx.fillRect(ox+c,oy+p[1],1,1); }
}
// genuine (2600 ROM) sprite SHAPE, shaded with an 800XL-style top highlight + bottom shadow
function drawShaded(parsed,cx,topY,mirror,topCol,baseCol,botCol){
  const w=parsed.w,h=parsed.h, ox=Math.round(cx-w/2), oy=Math.round(topY);
  const hi=Math.max(1,Math.floor(h*0.28));
  for(const p of parsed.pts){ const c=mirror?(w-1-p[0]):p[0];
    const col = p[1]<hi ? topCol : (p[1]>=h-1 ? botCol : baseCol);
    ctx.fillStyle=col; ctx.fillRect(ox+c,oy+p[1],1,1); }
}
const RS=2;                                    // internal super-sampling for a crisper, modern look
function render(){
  let shx=0, shy=0;
  if(shake>0){ const a=shake*10*RS; shx=(Math.random()*2-1)*a; shy=(Math.random()*2-1)*a; shake=Math.max(0,shake-0.035); }
  ctx.setTransform(RS,0,0,RS,shx,shy);
  px(-4,-4,FIELD_W+8,PLAY_H+HUD_H+8,'#000');     // slightly oversized so shake never reveals a gap
  if(!game)return; const g=game;

  // terrain drawn at device resolution with smooth (anti-aliased) coastlines — no chunky steps
  const step=1/RS;
  for(let y=0;y<PLAY_H;y+=step){
    const wy=s2w(y), e=riverEdges(wy);
    let L=e.left+shoreJit(wy,0), R=e.right+shoreJit(wy,1);
    L=Math.max(2,Math.min(FIELD_W-4,L)); R=Math.max(L+3,Math.min(FIELD_W-2,R));
    ctx.fillStyle=C.bank;     ctx.fillRect(0,y,FIELD_W,step);     // green land
    ctx.fillStyle=C.river;    ctx.fillRect(L,y,R-L,step);         // blue winding channel
    ctx.fillStyle=C.bankEdge; ctx.fillRect(L-1.5,y,1.5,step); ctx.fillRect(R,y,1.5,step);  // maroon shore
    if(e.islL>1){ let il=e.islL+shoreJit(wy,2), ir=e.islR+shoreJit(wy,2);
      ctx.fillStyle=C.island;     ctx.fillRect(il,y,Math.max(1,ir-il),step);
      ctx.fillStyle=C.islandEdge; ctx.fillRect(il-1.5,y,1.5,step); ctx.fillRect(ir,y,1.5,step); }
  }

  // objects
  for(const o of g.objs){
    if(!o.alive)continue; const sy=w2s(o.wy);
    if(sy<-26||sy>PLAY_H+8)continue;
    if(o.type===OBJ.BRIDGE){
      const e=riverEdges(o.wy), L=e.left|0, Rr=e.right|0, top=sy-6, hh=12;
      px(0,top,FIELD_W,hh,C.road);                              // grey road across full width
      px(0,top,FIELD_W,1,C.roadEdge); px(0,top+hh-1,FIELD_W,1,C.roadEdge);  // yellow edges
      px(L,top,Rr-L,hh,C.bridge);                               // brown bridge over the water
      px(L,top,Rr-L,1,C.bridgeDk); px(L,top+hh-1,Rr-L,1,C.bridgeDk);
      for(let i=L+2;i<Rr;i+=4) px(i,top+1,1,hh-2,C.bridgeDk);   // wooden planks
    } else if(o.type===OBJ.MOUNTAIN){
      const e=riverEdges(o.wy);
      const bx=o.onBank<0?(e.left*0.5):(e.right+(FIELD_W-e.right)*0.5);
      const s=o.size, base=sy;
      for(let r=0;r<s;r++){ const w=Math.round((r+1)*1.25); px(Math.round(bx-w/2),base-s+r,w,1,C.mountain); }
      px(Math.round(bx),base-s+2,Math.max(1,(s/2)|0),Math.max(1,(s-3)),C.mountainAcc);   // blue face
    } else if(o.type===OBJ.FUEL){
      const w=G.fuel.w,h=G.fuel.h, x0=Math.round(o.x-w/2), y0=Math.round(sy-h);
      px(x0-1,y0-1,w+2,h+2,C.fuelBody);             // magenta depot body
      sprite(G.fuel,o.x,y0,C.fuelMark,false);        // white "FUEL" markings
    } else if(o.type===OBJ.SHIP){ drawShaded(G.ship,o.x,sy-G.ship.h,o.dir>0,'#d8d8e0',C.ship,C.shipStripe);
    } else if(o.type===OBJ.HELI){ drawShaded((Math.floor(g.t*12)&1)?G.heli1:G.heli0,o.x,sy-G.heli0.h,o.dir>0,C.heliRotor,C.heli,'#3a7820');
    } else if(o.type===OBJ.JET){ drawShaded(G.plane,o.x,sy-G.plane.h,o.dir>0,'#c2f06a',C.plane,'#3c8222');
    } else if(o.type===OBJ.BALLOON){ drawActor(ACT.balloon,o.x,sy-ACT.balloon.h,false);
    } else if(o.type===OBJ.TANK){
      if(o.onBank){ const e=riverEdges(o.wy);
        o.x=o.onBank<0?Math.max(3,e.left/2):Math.min(FIELD_W-3,(e.right+FIELD_W)/2); }
      px(Math.round(o.x),sy-ACT.tank.h-2,1,2,C.tankDk);   // gun barrel
      drawActor(ACT.tank,o.x,sy-ACT.tank.h,false);
    }
  }

  // bullets
  for(const b of g.bullets) px(b.x-0.5,b.sy,1,5,C.bullet);
  // enemy missiles (800XL): horizontal streaks crossing the river
  for(const eb of g.ebullets){ const sy=w2s(eb.wy); px(eb.x-2,sy,4,1,'#ff4040'); px(eb.x+(eb.vx>=0?2:-2),sy,1,1,'#ffd0d0'); }

  // player plane — compact 800XL ROM jet (smaller than the 2600 sprite)
  if(g.state==='play'){
    if(!(g.invuln>0&&(Math.floor(g.t*12)%2)))
      sprite(G.pjet,g.jetX,JET_Y-G.pjet.h/2,C.jet,false);
  }

  // explosions
  for(const ex of g.explosions){
    const p=ex.t/ex.life, rad=(ex.big?9:6)*(0.4+p), ci=Math.min(3,Math.floor(p*4));
    for(let a=0;a<8;a++){ const an=a/8*Math.PI*2;
      px(ex.x+Math.cos(an)*rad-1,ex.y+Math.sin(an)*rad-1,2,2,C.explo[ci]); }
    px(ex.x-1,ex.y-1,2,2,C.explo[Math.max(0,ci-1)]);
  }

  // "LEVEL n" banner each time you clear a bridge
  if(g.banner>0 && g.state==='play'){
    const s=String(g.shownLevel), sc=4; let tot=0;
    for(const ch of s) tot+=(GD[+ch].w+1)*sc;
    let cx=CENTER-tot/2; const cy=PLAY_H/2-16;
    drawLabel('LEVEL',CENTER-20,cy-14,C.hudText,2);   // 5 chars * 4 * 2 / 2 = 20
    for(const ch of s){ const gd=GD[+ch]; ctx.fillStyle='#ffe14d';
      for(const p of gd.pts) ctx.fillRect(cx+p[0]*sc,cy+p[1]*sc,sc,sc); cx+=(gd.w+1)*sc; }
  }

  // "PRESS FIRE" prompt while frozen at the bridge after a death
  if(g.waiting && g.state==='play' && Math.floor(g.t*3)%2){
    drawLabel('PRESS FIRE',CENTER-40,PLAY_H/2,'#ffe14d',2);
  }

  drawHUD();
}

function drawDigits(n,width,x,y,scale,color){
  const s=String(n).padStart(width,'0'); let cx=x;
  for(const ch of s){ const gd=GD[+ch]; ctx.fillStyle=color;
    for(const p of gd.pts) ctx.fillRect(cx+p[0]*scale,y+p[1]*scale,scale,scale);
    cx+=(gd.w+1)*scale; }
  return cx;
}
function drawHUD(){
  const g=game, y0=PLAY_H;
  px(0,y0,FIELD_W,HUD_H,C.hudPanel);                   // 800XL grey status panel
  px(0,y0,FIELD_W,1,'#7a7a7a');                         // subtle top edge
  // --- left: P1 + big score ---
  drawLabel('P1',4,y0+3,C.hudText,1);
  drawDigits(g.score,5, 4, y0+11, 2, C.hudText);        // ends ~x84
  // --- centre-top: remaining planes ---
  for(let i=0;i<Math.min(g.lives-1,3);i++) sprite(G.pjet, 92+i*9, y0+5, '#303030', false);
  // --- right: HI score + BRIDGE counter (two tidy lines) ---
  drawLabel('HI',122,y0+3,C.hudText,1); drawDigits(best,5,136,y0+3,1,C.hudText);    // ->176
  drawLabel('BRIDGE',118,y0+12,C.hudText,1);
  drawDigits(g.shownLevel,String(g.shownLevel).length,160,y0+12,1,C.hudText);
  // --- bottom: full-width fuel gauge  E [=====] F ---
  const gx=16, gy=y0+30, gw=156, gh=8;
  px(gx-2,gy-2,gw+4,gh+4,C.hudText);                    // frame
  px(gx,gy,gw,gh,'#181818');
  const fc=g.fuel<0.25?C.fuelLow:g.fuel<0.5?C.fuelWarn:C.fuelGood;
  px(gx,gy,Math.round(gw*g.fuel),gh,fc);
  px(gx+(gw>>1),gy,1,gh,'#888');                        // ½ tick
  drawLabel('E',gx-9,gy+2,C.hudText,1); drawLabel('F',gx+gw+4,gy+2,C.hudText,1);
}
// tiny 3x5 label font
const LF={F:['111','100','111','100','100'],U:['101','101','101','101','111'],
  E:['111','100','111','100','111'],L:['100','100','100','100','111'],
  S:['111','100','111','001','111'],T:['111','010','010','010','010'],
  A:['111','101','111','101','101'],G:['111','100','101','101','111'],
  V:['101','101','101','101','010'],I:['111','010','010','010','111'],
  R:['110','101','110','101','101'],P:['111','101','111','100','100'],
  B:['110','101','110','101','110'],D:['110','101','101','101','110'],
  H:['101','101','111','101','101'],M:['101','111','111','101','101']};
function drawLabel(str,x,y,col,sc){ sc=sc||1; ctx.fillStyle=col; let cx=x;
  for(const ch of str){ const gl=LF[ch]; if(gl){ for(let r=0;r<5;r++)for(let c=0;c<3;c++) if(gl[r][c]==='1')ctx.fillRect(cx+c*sc,y+r*sc,sc,sc); } cx+=4*sc; } }

/* -------------------------------------------------------------- ui */
const exitBtn=document.getElementById('btnExit');
function showExit(on){ exitBtn.classList.toggle('hidden', !on);
  if(typeof isTouch!=='undefined'&&isTouch){ autoChip.classList.toggle('hidden', !on);
    if(dragHintEl) dragHintEl.style.opacity = on ? '0.65' : '0'; } }
function show(id){ for(const s of ['titleScreen','pauseScreen','overScreen']) document.getElementById(s).classList.add('hidden');
  if(id) document.getElementById(id).classList.remove('hidden'); }
let paused=false;
function togglePause(){ if(!game||game.state!=='play'&&!paused)return;
  paused=!paused; if(paused){ show('pauseScreen'); A2.stopEngine(); } else { show(null); A2.startEngine(); } }
// quit the current round back to the title screen (visible ✕, works without a keyboard)
function exitToTitle(){ if(!game)return; paused=false; A2.stopEngine(); game.state='title';
  showExit(false); document.getElementById('tiltTag').classList.add('hidden'); show('titleScreen'); }
exitBtn.addEventListener('click', exitToTitle);
function goFullscreen(){ const el=document.documentElement;
  const fn=el.requestFullscreen||el.webkitRequestFullscreen; if(fn){ try{ fn.call(el); }catch(e){} } }
function startGame(sec){ sec=(typeof sec==='number')?sec:0; A2.init(); A2.resume();
  recalibrateTilt();                                   // neutral = how you're holding it now
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')
    DeviceOrientationEvent.requestPermission().then(p=>{if(p==='granted')enableTilt();}).catch(()=>{});
  else enableTilt();
  if(isTouch){ document.getElementById('tiltTag').classList.remove('hidden'); goFullscreen(); }
  show(null); showExit(true); A2.startEngine(); newGame(sec); paused=false; }
// title-screen bridge select (start at any bridge, like the 800XL cartridge)
const MAX_BRIDGE=99;                         // difficulty caps at 48; geometry loops beyond
let startBridge=1;
const brNum=document.getElementById('brNum');
function setBr(n){ startBridge=((n-1+MAX_BRIDGE)%MAX_BRIDGE)+1; brNum.textContent=startBridge; }
function holdRepeat(id,fn){ const el=document.getElementById(id); let t,iv;
  const start=e=>{e.preventDefault(); fn(); t=setTimeout(()=>{iv=setInterval(fn,70);},320);};
  const stop=()=>{clearTimeout(t);clearInterval(iv);};
  el.addEventListener('mousedown',start); el.addEventListener('touchstart',start,{passive:false});
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=>el.addEventListener(ev,stop)); }
holdRepeat('brDown',()=>setBr(startBridge-1));
holdRepeat('brUp',()=>setBr(startBridge+1));
document.getElementById('startBtn').addEventListener('click',()=>startGame(startBridge-1));
document.getElementById('againBtn').addEventListener('click',()=>startGame(0));
document.getElementById('continueBtn').addEventListener('click',()=>startGame(lastStageSec));
document.getElementById('resumeBtn').addEventListener('click',togglePause);

const isTouch=('ontouchstart'in window)||navigator.maxTouchPoints>0;
if(isTouch){ document.getElementById('touch').classList.remove('hidden');
  document.getElementById('tiltHint').textContent='Mobile: drag to steer (or tilt) · tilt fwd/back for speed · tap AUTO for auto-fire';
  document.getElementById('keyHelp').classList.add('hidden');
  setAuto(false);                                 // auto-fire OFF by default — tap FIRE, or toggle AUTO
  const tt=document.getElementById('tiltTag');
  tt.textContent='TILT ⟳';
  const recal=e=>{e.preventDefault(); recalibrateTilt();};
  tt.addEventListener('touchstart',recal,{passive:false}); tt.addEventListener('click',recal);
}
// "did you know" facts ticker on the title screen (all verified)
const FACTS=[
  "River Raid was designed and programmed by Carol Shaw (Activision, 1982) — widely credited as the first female video-game designer.",
  "Carol Shaw was the first woman to have her name printed on a video-game box.",
  "There is no stored map — the entire river, islands, bridges and enemies are generated on the fly by an algorithm (a linear-feedback shift register).",
  "Because that algorithm is seeded the same way every time, the river is identical on every play, yet almost no map data is stored.",
  "The whole game — code, graphics and logic — fits in just 4 KB of ROM, with no bank-switching.",
  "River Raid popularized the vertically-scrolling shooter on home consoles (Shaw was inspired by the arcade game Scramble).",
  "In 1984 West Germany restricted its sale to minors — the official reason on record was that it 'glorified war.'",
  "It sold over a million cartridges, earning Activision a platinum award."
];
(function(){
  const t=document.getElementById('tickerTrack'); if(!t)return;
  const line='★ DID YOU KNOW — '+FACTS.join('   ◆   ')+'   ◆   ';
  t.textContent=line+line;     // duplicated so the loop wraps seamlessly
})();
// keep render crisp on high-dpi / orientation change
addEventListener('orientationchange',()=>{ recalibrateTilt(); });
</script>

// register the service worker for offline / installable PWA (no-op when unsupported)
if('serviceWorker' in navigator){
  addEventListener('load',()=>{ navigator.serviceWorker.register('service-worker.js').catch(()=>{}); });
}
